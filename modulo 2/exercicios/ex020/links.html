<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = children

        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited { /* Pseudo-classe*/
            color: darkred;
        }

        a:hover { /* Pseudo-classe*/
            color: black;
            text-decoration: underline;
        }

        a:active { /* Pseudo-classe*/
            color: yellow;
        }

        .especial { /* Classe */
            background-color: rgb(255, 140, 140);
        }

        .especial::before { /* Pseudo-elemento */
            content: "⇐ ";
        }

        .especial::after { /* Pseudo-elemento */
            content: " ⇒";
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório Github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" class="especial">Site do CursoemVideo</a></li>

    </ul>
</body>
</html>
